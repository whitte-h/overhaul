# Pushing a tag vX.Y.Z (matching package.json's version) tests, builds the tarball and publishes
# the GitHub Release with the tarball, its sha256 and install.sh (for the one-line install).
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: zsh and tmux (installer and restart tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh tmux
      - run: npm ci
      - run: npm test
      - name: Build the tarball
        run: node scripts/release.mjs --tag "$GITHUB_REF_NAME" --out dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/overhaul-$GITHUB_REF_NAME.tar.gz" \
            "dist/overhaul-$GITHUB_REF_NAME.tar.gz.sha256" \
            install.sh \
            --title "Overhaul $GITHUB_REF_NAME" --generate-notes --verify-tag

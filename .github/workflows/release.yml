# Pushing a tag vX.Y.Z (matching package.json's version) tests, builds the executable on each
# platform's own runner (Node SEA: scripts/build.mjs), runs the contract tests against it, and
# publishes the GitHub Release (docs/contract.md, "Release"):
#   overhaul-<os>-<arch> + .sha256 for darwin-arm64, darwin-x64, linux-arm64, linux-x64
#   install.sh (one-line install), overhaul-vX.Y.Z.tar.gz + .sha256 (what v0.1's `overhaul update` downloads)
#   overhaul.rb (Homebrew formula for this release; committed to the tap only when HOMEBREW_TAP_TOKEN is set)
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  # The Node the executables carry.
  NODE_VERSION: 24

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the v0.1 -> executable test builds v0.1.0 from its commit
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: zsh and tmux (installer and restart tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends zsh tmux
      - run: npm ci
      - run: npm test

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-14 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-x64, runner: ubuntu-24.04 }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Build the executable
        run: node scripts/build.mjs --out dist
      - name: It is the platform it claims to be
        run: test -f "dist/overhaul-${{ matrix.platform }}" && test -f "dist/overhaul-${{ matrix.platform }}.sha256"
      - name: Contract tests against the executable
        run: OVERHAUL_BIN="dist/overhaul-${{ matrix.platform }}" node --test test/contract*.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: overhaul-${{ matrix.platform }}
          path: |
            dist/overhaul-${{ matrix.platform }}
            dist/overhaul-${{ matrix.platform }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: overhaul-*
          path: dist
          merge-multiple: true
      - name: Checksums match the executables
        run: cd dist && sha256sum -c overhaul-*.sha256
      - name: Build the tarball
        run: node scripts/release.mjs --tag "$GITHUB_REF_NAME" --out dist
      - name: Homebrew formula for this release
        run: node scripts/homebrew.mjs --version "${GITHUB_REF_NAME#v}" --dist dist --out dist/overhaul.rb
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/overhaul-darwin-arm64 dist/overhaul-darwin-arm64.sha256 \
            dist/overhaul-darwin-x64 dist/overhaul-darwin-x64.sha256 \
            dist/overhaul-linux-arm64 dist/overhaul-linux-arm64.sha256 \
            dist/overhaul-linux-x64 dist/overhaul-linux-x64.sha256 \
            "dist/overhaul-$GITHUB_REF_NAME.tar.gz" \
            "dist/overhaul-$GITHUB_REF_NAME.tar.gz.sha256" \
            install.sh dist/overhaul.rb \
            --title "Overhaul $GITHUB_REF_NAME" --generate-notes --verify-tag

  # The tap (a public repo, whitte-h/homebrew-tap) is not created by this workflow. Once it exists,
  # a HOMEBREW_TAP_TOKEN secret with write access to it turns this job on.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPO: whitte-h/homebrew-tap
    steps:
      - name: Formula from the release
        if: env.TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern overhaul.rb --dir .
      - name: Commit it to the tap
        if: env.TAP_TOKEN != ''
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          mkdir -p tap/Formula
          cp overhaul.rb tap/Formula/overhaul.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/overhaul.rb
          git diff --cached --quiet || git commit -m "overhaul ${GITHUB_REF_NAME}"
          git push
